# ─────────────────────────────────────────────────────────────────────────────
#  application-hsm-sansec-docker.properties — Sansec ağ HSM'i (libupkcs11.so)
#  linux/amd64 container içinde IN-PROCESS PKCS#11
# ─────────────────────────────────────────────────────────────────────────────
#  Aktivasyon:
#    --spring.profiles.active=local,hsm-sansec-docker
#  (local profile network'i kapatır; bu dosya HSM/PKCS#11 yolunu kurar)
#
#  NEDEN AYRI PROFİL / NEDEN DOCKER?
#    Vendor kütüphaneleri libupkcs11.so + libswsds.so **Linux x86-64 ELF**.
#    macOS (Mach-O) ve özellikle Apple Silicon (arm64) JVM'i bunları JNI ile
#    YÜKLEYEMEZ → UnsatisfiedLinkError ("wrong architecture"). Kaynak kod
#    olmadığı için .dylib'e derlemek de mümkün değil.
#
#    Çözüm bu repo'nun kendi kanıtlanmış deseni (bkz.
#    devops/docker/Dockerfile.pkcs11-tests): "native lib + JVM AYNI process'te
#    olmak zorunda; o yüzden JVM'i .so ile aynı ABI'ye taşı." Yani tüm Signer
#    uygulamasını linux/amd64 bir container içinde çalıştırırız; .so orada
#    IN-PROCESS yüklenir (32/64-bit köprüsüne gerek YOK — JVM ve .so ikisi de
#    linux/amd64). Docker Desktop Apple Silicon'da bunu Rosetta/QEMU ile emüle
#    eder.
#
#  ÇALIŞTIRMA (özet — detay: docs/RUN_PROFILES.md §8):
#    1) cp devops/docker/.env.hsm-dev.example devops/docker/.env.hsm-dev
#       → HSM_LIB_DIR (libupkcs11.so'nun bulunduğu host dizini) + CERTIFICATE_PIN doldur
#    2) Host'ta jar üret:  ./mvnw -q -DskipTests package   (veya IntelliJ "Make")
#    3) docker compose -f devops/docker/docker-compose.hsm-dev.yml \
#            --env-file devops/docker/.env.hsm-dev up --build
#    4) IntelliJ: "Signer - HSM Sansec (Docker attach 5005)" ile :5005'e debugger bağla
#
#  ÖN KOŞUL: Sansec HSM'i (swsds0.ini'deki ip:port) container'dan ağ olarak
#  ERİŞİLEBİLİR olmalı. Fiziksel kart gerekmez — bu ağ HSM'i.
# ─────────────────────────────────────────────────────────────────────────────

# Container-içi PKCS#11 modül yolu. docker-compose.hsm-dev.yml, HSM_LIB_DIR'i
# /opt/hsm'e mount eder; libswsds.so aynı dizinde LD_LIBRARY_PATH=/opt/hsm ile
# bulunur; swsds0.ini / upkcs11.ini / OBJSP02 cache WORKDIR=/opt/hsm'den okunur.
# NOT: compose env'i aynı değişkeni set eder ve bu default'u override eder.
PKCS11_LIBRARY=/opt/hsm/libupkcs11.so

# Slot otomatik tespit: -1 → SunPKCS11/IAIK ilk uygun slot'u seçer.
PKCS11_SLOT=-1
PKCS11_SLOT_LIST_INDEX=-1

# Sansec upkcs11 standart C_Initialize(CKF_OS_LOCKING_OK) kabul eder; auto-detect
# CKR_ARGUMENTS_BAD'da zaten devreye girer. Operatör isterse env ile true verebilir.
PKCS11_NULL_INIT_ARGS=false

# Ağ HSM'i — akıllı kartın aksine paralel oturum kaldırır. swsds0.ini
# [ConnectionPool] poolsize=10 ile uyumlu tutulur; yük için env ile artırılır.
MAX_SESSION_COUNT=10

# CERTIFICATE_PIN / CERTIFICATE_ALIAS / CERTIFICATE_SERIAL_NUMBER →
# docker-compose.hsm-dev.yml içine .env.hsm-dev'den (gitignored) enjekte edilir.
# Container WORKDIR=/opt/hsm olduğundan repo kökündeki local-secrets.properties
# burada bulunmaz; bu import "optional:" olduğu için sessizce atlanır (hata değil).
spring.config.import=optional:file:./local-secrets.properties
